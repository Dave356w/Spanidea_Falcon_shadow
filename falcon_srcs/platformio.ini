; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ATmega328PB]
;[env:ATmega328P]
platform = atmelavr
board = ATmega328PB
;board = ATmega328P
framework = arduino
board_build.f_cpu = 1000000L
; SRAM on the ATmega328PB is only 2 KB and FreeRTOS task stacks are malloc'd at
; runtime, so trim the Arduino HardwareSerial ring buffers (debug UART only, no
; serial input) to free RAM for the scheduler. Adjust if serial data is dropped.
build_flags =
    -DTWI_FREQ=100000L
    -DSERIAL_RX_BUFFER_SIZE=16
    -DSERIAL_TX_BUFFER_SIZE=32
upload_port = COM7
upload_protocol = stk500
upload_flags = -pm328pb
;upload_flags = -pm328p
upload_command = avrdude -c$UPLOAD_PROTOCOL -P$UPLOAD_PORT $UPLOAD_FLAGS -U flash:w:$SOURCE:i
lib_deps =
    labfruits/Mcp320x@^1.4.2
    adafruit/Adafruit DPS310@^1.1.4
    feilipu/FreeRTOS@^11.1.0-3