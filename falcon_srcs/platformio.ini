; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ATmega328PB]
;[env:ATmega328P]
platform = atmelavr
board = ATmega328PB
;board = ATmega328P
framework = arduino
board_build.f_cpu = 1000000L

; TWI_FREQ configures TWI0 (Wire). The BMA456 is on TWI1 (Wire1) and sets its
; own rate via TWBR1 in arduino_bma456.cpp, so this flag does not affect the
; accelerometer. It still needs to be legal: at F_CPU=1MHz the TWI ceiling is
; F_CPU/16 = 62.5kHz, so the previous 100000L made twi_init() compute
; TWBR = ((1000000/100000)-16)/2 = -3, which wraps to 253 in a uint8_t and
; yields ~1.9kHz. 25000L gives TWBR = 12, above the datasheet minimum of 10
; for master mode. Nothing is on TWI0 today (the DPS310 is depopulated).
; ⬜ -DWIRE_TIMEOUT is the RIGHT fix for the TWI lockup (see the lockup
; defences block in main.cpp) and STILL DOES NOT FIT, but the gap is smaller
; than previously recorded. Re-measured 2026-08-12 with -Wl,--relax in place:
; +1554 bytes (not the +1818 measured without relaxation), landing at
; 33454/32256 = 103.7%, so the shortfall is 1198 bytes. RAM cost is trivial
; (+12, to 1455). There is no runtime-only escape: MiniCore guards every
; timeout check in Wire1/utility/twi1.c behind #if defined(WIRE_TIMEOUT), so
; calling Wire1.setWireTimeout() cannot arm bounded waits on its own -- the
; code simply is not compiled. micros() is already linked (main.cpp's ISR read
; timing), so the 1554 is 32-bit compare arithmetic replicated across seven
; wait sites plus twi_handleTimeout1.
;
; -Wl,--relax is worth 314 bytes on its own (32214 -> 31900) and is pure
; linker relaxation: CALL/JMP become RCALL/RJMP where the target is in range.
; -flto was tried the same day and gained EXACTLY ZERO -- PlatformIO does not
; apply it at the link step for this platform -- so do not re-try it.
build_flags = -DTWI_FREQ=25000L -Wl,--relax

; MUST match SERIAL_BAUD_RATE in main.cpp -- see the block above Serial.begin()
; for why this is a detection fix rather than a convenience, and for the full
; table of reachable rates.
;
; Raised 9600 -> 62500 on 2026-08-13. Serial.print blocks loop() when the TX
; buffer fills, and loop() drains the sample ring and steps the alarm; the
; 732-character burst at alert onset took ~760 ms at 9600 and takes ~117 ms
; here. That ~760 ms was the chase stutter Dave reported and is the same
; mechanism as the ~20% snapshot overrun.
;
; The Readme documents 115200 and that rate is UNREACHABLE at F_CPU = 1 MHz --
; nearest divisor is 125000, an 8.5% error. That is why the 2026-07-15 EFT
; attempt produced a blank terminal; it was recorded as unexplained and it was
; arithmetic. Reachable exact rates are 31250 (UBRR=3) and 62500 (UBRR=1).
;
; ⚠️ If a terminal or adapter garbles at 62500, drop BOTH this and
; SERIAL_BAUD_RATE to 31250 -- still exact, still 3.25x better than 9600.
monitor_speed = 62500

; ⚠️ upload_port IS THE ISP PROGRAMMER'S PORT, NOT THE BOARD'S LOG UART.
; upload_protocol is stk500 -- a separate programmer dongle -- so this is not
; the port monitor_speed talks to. Point avrdude at the board's CP210x and it
; syncs against nothing, retries silently and hangs for minutes with no useful
; error. That happened on 2026-08-19 and cost a session.
;
; It is left COMMENTED OUT ON PURPOSE. The programmer enumerates differently on
; almost every reconnect -- COM4, COM6 and COM7 all in one day -- so any value
; committed here is wrong by the next session, which is exactly how the stale
; `upload_port = COM6` survived. Pass the port explicitly instead:
;
;   pio run -e ATmega328PB -t upload --upload-port COMn
;
; TO FIND n, ask the programmer rather than guessing. A signature read is
; harmless, takes a second, and answers definitively:
;
;   avrdude -c stk500 -P COMn -p m328pb -U signature:r:-:h
;
;   0x1e,0x95,0x16          -> that is the programmer, and the m328pb is alive
;   "timeout communicating" -> wrong port; that one is the log UART or unrelated
;
; The same read also revives a target that has gone silent (it resets it).
;
;upload_port = COM6
upload_protocol = stk500
upload_flags = -pm328pb
;upload_flags = -pm328p
upload_command = avrdude -c$UPLOAD_PROTOCOL -P$UPLOAD_PORT $UPLOAD_FLAGS -U flash:w:$SOURCE:i
lib_deps =
    labfruits/Mcp320x@^1.4.2
    adafruit/Adafruit DPS310@^1.1.4

; ─── ⛔ BENCH-ONLY TEST BUILD: brownout vs TWI wedge ──────────────────────────
;
; NEVER FLASH THIS FOR A CAR RUN. It bypasses the FSM completely, so NOTHING can
; release the beacon -- no arrival path, no jog verdict, no failsafe. That is
; deliberate: the build tests what a long continuous alarm does to the rail and
; to the TWI bus, and it must not be able to end the alarm using the logic under
; test.
;
;   pio run -e brownout_test -t upload
;   pio device monitor -p COM5 -b 62500
;
; It prints one BRN line per second carrying VCC measured against the 1.1 V
; bandgap in BOTH the blast phase and the quiet phase, plus tw= and ov=. The
; shipping battery read cannot see a sagging rail because it uses AVCC as its
; own reference and is therefore ratiometric; the bandgap read is not. See
; read_vcc_mv() in adc.cpp and Eng_Notes/falcon_500fpm_ui_2026-08-13.md §9.
;
; Reading the result:
;   vcc_blast well below vcc_quiet, both falling  -> rail sag is real
;   both flat and equal, then the device hangs    -> TWI wedge
;   survives past 243 s with tw= climbing         -> wedge, now being caught
;   Reset cause: 0x8 mid-alarm                    -> wedge, watchdog caught it
;
; Expect it to run until the pack is genuinely flat if the hypothesis is right,
; so do not leave it unattended on cells you care about.
[env:brownout_test]
extends = env:ATmega328PB
build_flags = ${env:ATmega328PB.build_flags} -DBROWNOUT_TEST=1

; ─── ⛔ BENCH-ONLY: battery characterisation (test plan Session A) ─────────────
;
; NEVER FLASH THIS FOR A CAR RUN. It replaces the battery threshold logic with
; raw instrumentation and FORCES the low-battery alarm on a timer, so it cannot
; report a real battery state.
;
; It is a SUPERSET of shipping, not a bypass -- the FSM, calibration, the beacon
; and the heartbeat all run exactly as shipped, so a rejected calibration
; (Session A7) and beacon-suppresses-chirp (A4) can both be checked in it. That
; is the deliberate difference from brownout_test, whose first flash measured an
; unloaded rail because the call driving the piezo was unreachable past a break.
;
;   pio run -e bench_battery -t upload
;   pio device monitor -p COM5 -b 62500
;
; Prints one BB line per second:
;
;   BB t=42s raw 1ms=768 3ms=771 6ms=772 10ms=772 20ms=772 50ms=772
;             mv10=2339 vcc=3115 bat=0
;
;   raw <n>ms=   ADC count at that delay after the divider is enabled. If the
;                counts have stopped moving by the 10 ms tap, BATTERY_SETTLE_MS
;                is sound -- a question open since the day it was written.
;   mv10=        what the SHIPPING build would have recorded. Correlate THIS
;                with the meter to get volts-per-count.
;   vcc=         rail, via the 1.1 V bandgap; unlike the battery read it is not
;                ratiometric with AVCC.
;
; Forces the chirp ON at 30 s and OFF at 90 s. Shake the unit during that window
; to confirm the beacon suppresses it.
;
; ⚠️ SHARES configure_adc_channel() WITH SHIPPING AND MUST KEEP DOING SO. If the
; ADC prescaler is fixed (it is /128 under a comment reading "for 8MHz clock"
; while F_CPU is 1 MHz, so the ADC clock is 7.8 kHz against a 50 kHz datasheet
; minimum), it changes for BOTH and every number taken here is re-taken.
;
; ⚠️ NOT for quiescent current. Measure that on the SHIPPING build with the
; serial cable DISCONNECTED -- it back-powers the board through the RX ESD clamp.
[env:bench_battery]
extends = env:ATmega328PB
build_flags = ${env:ATmega328PB.build_flags} -DBATTERY_BENCH=1

; ─── ⛔ BENCH-ONLY: stepped quiescent-current measurement (test plan A5) ───────
;
; NEVER FLASH THIS FOR A CAR RUN. It holds D2 in fixed states and disables
; logging for part of every cycle.
;
;   pio run -e idle_current -t upload
;
; ⚠️ THEN DISCONNECT THE SERIAL CABLE BEFORE MEASURING. It back-powers the board
; through the RX ESD clamp, so any current reading with it attached is of a
; partly externally-powered board. That is also why the phases are announced by
; PIEZO CHIRPS -- there is no console to watch.
;
; Meter in SERIES WITH THE PACK. Four 60 s phases, looping. Read in the quiet
; stretch between markers, not during them:
;
;   1 chirp   D2 off,  logging ON    baseline (shipping idle, minus the beat)
;   2 chirps  D2 dim,  logging ON    dim  - baseline = heartbeat LED cost
;   3 chirps  D2 full, logging ON    full - baseline = ALARM LED cost
;   4 chirps  D2 off,  logging OFF   baseline - this = continuous logging cost
;
; Then: heartbeat average = (dim - baseline) / 50, because the beat is
; HEARTBEAT_FLASH_MS 80 of HEARTBEAT_PERIOD_MS 4000.
;
; ⚠️ Keep the unit still. A knock latches a departure, and LATCH_FAILSAFE_MS is
; 600 s -- the beacon would run for ten minutes and wreck the cycle.
[env:idle_current]
extends = env:ATmega328PB
build_flags = ${env:ATmega328PB.build_flags} -DIDLE_CURRENT_TEST=1
; ─── PRODUCTION BUILDS: serial logging compiled out ──────────────────────────
;
; FALCON_LOG is defined in src/falcon_log.h and defaults to 2. Read the ⚠️ in
; that header before shipping either of these: dropping the per-sample print
; removes the blocking that has been throttling the sample consumer, so these
; builds feed their detectors MORE samples than the population every threshold
; on file was measured against. That is session A's verification clause and it
; is not closed by the flash number alone.
;
;   pio run -e production            -> events + a HEALTH line every 30 s
;   pio run -e production_silent     -> nothing on the wire at all
;
; Measured 2026-08-20, same source:
;
;   env                 flash   free   RAM
;   ATmega328PB         31550    706   1492   FALCON_LOG 2, the test build
;   production          31122   1134   1497   FALCON_LOG 1
;   production_silent   25354   6902   1149   FALCON_LOG 0
;
; production_silent also returns 343 bytes of RAM -- the Serial TX/RX buffers.
; ⚠️ It cannot be diagnosed in the field by any means this project has. Prefer
; `production` unless the current draw is what is being bought.

[env:production]
extends = env:ATmega328PB
build_flags = ${env:ATmega328PB.build_flags} -DFALCON_LOG=1

[env:production_silent]
extends = env:ATmega328PB
build_flags = ${env:ATmega328PB.build_flags} -DFALCON_LOG=0
